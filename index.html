<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabsBin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="leads-tracker__section">
    <div class="container">
      <input type="text" id="lead-input-el" class="leads-tracker__input" placeholder="Enter URL">
      <button id="save-lead-btn" class="leads-tracker__button">Save Lead</button>
      <button id="save-tab" class="leads-tracker__button">Save Tab</button>
      <button id="delete-btn" class="leads-tracker__button">Delete All</button>
      <ul id="leads-list" class="leads-tracker__list"></ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
